<html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Victor - Avec Gemini</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input, button { padding: 12px; font-size: 16px; margin: 8px 0; }
        #reponse { margin-top: 20px; padding: 20px; background: #f0f8ff; border-radius: 8px; min-height: 120px; }
    </style>
</head>
<body>
    <h1>Victor - Version Finale avec Gemini</h1>
    
    <h2>Discute avec Victor</h2>
    <input type="text" id="question" placeholder="Ex: Parle-moi des croissants" style="width:700px">
    <button onclick="parlerAVictor()">Envoyer à Victor</button>

    <div id="reponse"></div>

    <script>
        const API_KEY = "AIzaSyDVG8wplMqe3-PrG1UpvUqMw7bNoeRYccc";

        async function parlerAVictor() {
            const question = document.getElementById('question').value.trim();
            if (!question) return alert("Pose une question à Victor");

            const div = document.getElementById('reponse');
            div.innerHTML = "Victor réfléchit...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ 
                                text: "Tu t'appelles Victor. Tu es une IA sympathique et pédagogue. Réponds en français de façon naturelle et assez courte.\n\nQuestion: " + question 
                            }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const texte = data.candidates?.[0]?.content?.parts?.[0]?.text || "Pas de réponse.";
                div.innerHTML = `<strong>Victor :</strong><br><br>${texte}`;

            } catch (e) {
                console.error(e);
                div.innerHTML = `<strong>Erreur :</strong><br>${e.message}`;
            }
        }
    </script>
</body>
</html>
